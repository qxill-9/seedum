<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            text-align: center;
        }

        h1 { font-size: 3rem; }

        .img {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }

        .img img {
            width: 50%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* ---------- JUMP SCARE ---------- */
        #scare {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            justify-content: center;
            align-items: center;
            animation: shake 0.08s infinite;
        }

        #scare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: zoom 0.3s ease-out forwards, flash 0.15s infinite;
        }

        @keyframes zoom {
            from { transform: scale(0.3); }
            to   { transform: scale(1.1); }
        }

        @keyframes shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-12px, 8px); }
            50%  { transform: translate(10px, -10px); }
            75%  { transform: translate(-8px, -6px); }
            100% { transform: translate(8px, 10px); }
        }

        @keyframes flash {
            0%, 100% { filter: none; }
            50%      { filter: invert(1) contrast(1.5); }
        }
    </style>
</head>
<body>
    <h1>ไอดำ</h1>
    <div class="img">
        <img src="854994058_2185994448985481_5094715257163195428_n.jpg">
        <img src="856396241_2074692346486379_7209444901269555785_n.jpg">
    </div>

    <!-- The scare screen (hidden until triggered) -->
    <div id="scare">
        <img src="856396241_2074692346486379_7209444901269555785_n.jpg">
    </div>

    <script>
        const scare = document.getElementById('scare');
        const DELAY = 1500; // ms after the page loads

        function screamSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();

            const distortion = ctx.createWaveShaper();
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                const x = (i / 128) - 1;
                curve[i] = Math.sign(x) * Math.pow(Math.abs(x), 0.2);
            }
            distortion.curve = curve;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
            distortion.connect(gain).connect(ctx.destination);

            [880, 1320].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(freq * 1.6, ctx.currentTime + 0.5 + i * 0.2);
                osc.connect(distortion);
                osc.start();
                osc.stop(ctx.currentTime + 2);
            });

            const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.connect(distortion);
            noise.start();

            // Browsers often block sound until the visitor interacts with the page.
            // If so, the sound starts on their first click / key press / touch.
            ctx.resume().catch(() => {});
            if (ctx.state === 'suspended') {
                const unlock = () => ctx.resume();
                ['click', 'keydown', 'touchstart', 'pointerdown'].forEach(evt =>
                    document.addEventListener(evt, unlock, { once: true })
                );
            }
        }

        function jumpScare() {
            scare.style.display = 'flex';
            screamSound();
            if (navigator.vibrate) navigator.vibrate([200, 50, 200, 50, 400]);
        }

        // Fires automatically when the page opens
        window.addEventListener('load', () => setTimeout(jumpScare, DELAY));

        // Click the scare or press Esc to close it
        scare.addEventListener('click', () => scare.style.display = 'none');
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') scare.style.display = 'none';
        });
    </script>
</body>
</html>
